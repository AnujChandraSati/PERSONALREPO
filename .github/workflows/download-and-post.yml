name: Download Reddit Media and Post to Telegram

# Manually/API-triggered only — n8n calls this via the GitHub REST API.
on:
  workflow_dispatch:
    inputs:
      reddit_post_url:
        description: "Full Reddit post URL to fetch media from"
        required: true
        type: string
      telegram_chat_id:
        description: "Target Telegram chat/channel ID to post the image(s) to"
        required: true
        type: string

jobs:
  download-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run downloader
        env:
          REDDIT_POST_URL: ${{ inputs.reddit_post_url }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.telegram_chat_id }}
        run: python download_and_post.py
